services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nepse
      POSTGRES_PASSWORD: nepse
      POSTGRES_DB: nepse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nepse -d nepse"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
